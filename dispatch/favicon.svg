<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square with brand gradient -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="0.75"/>

  <!-- Speed / motion lines behind the truck (dispatch = movement) -->
  <g stroke-linecap="round" stroke-width="1.6">
    <line x1="3.5" y1="12" x2="7" y2="12" stroke="#fff" stroke-opacity="0.45"/>
    <line x1="2.5" y1="16" x2="7" y2="16" stroke="#fff" stroke-opacity="0.65"/>
    <line x1="3.5" y1="20" x2="7" y2="20" stroke="#fff" stroke-opacity="0.45"/>
  </g>

  <!-- Truck trailer / cargo box with play triangle (video tutorials) -->
  <g transform="translate(0 0)">
    <!-- Trailer body -->
    <rect x="8" y="9" width="13" height="11" rx="2" fill="#fff"/>
    <!-- Play triangle inside the trailer — represents the video library -->
    <path d="M13 12.5 L18 14.5 L13 16.5 Z" fill="url(#accent)"/>
  </g>

  <!-- Truck cab -->
  <g>
    <path d="M21 12 L25.5 12 L27.5 14.5 L27.5 20 L21 20 Z" fill="#fff" fill-opacity="0.92"/>
    <!-- Cab window -->
    <path d="M22.2 13 L25 13 L26.3 14.6 L22.2 14.6 Z" fill="url(#accent)" fill-opacity="0.85"/>
  </g>

  <!-- Wheels -->
  <g fill="#0f172a">
    <circle cx="12" cy="22" r="2.2"/>
    <circle cx="18" cy="22" r="2.2"/>
    <circle cx="25" cy="22" r="2.2"/>
  </g>
  <!-- Wheel hubs -->
  <g fill="#fff" fill-opacity="0.85">
    <circle cx="12" cy="22" r="0.8"/>
    <circle cx="18" cy="22" r="0.8"/>
    <circle cx="25" cy="22" r="0.8"/>
  </g>

  <!-- Road line under the truck -->
  <line x1="4" y1="25.5" x2="28" y2="25.5" stroke="#fff" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round"/>
</svg>
